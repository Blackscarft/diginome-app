name: Deploy Laravel to CWP 7

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted  # Menggunakan Self-Hosted Runner di server CWP 7 Anda

    steps:
      # 1. Checkout Kode Terbaru dari Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sinkronkan File Proyek ke Folder Web CWP 7
      - name: Sync Files to Web Directory
        run: |
          rsync -rlptdz --delete \
            --no-g --no-o --no-p --omit-dir-times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/*.key' \
            --exclude='storage/app/public/*' \
            --exclude='public/storage' \
            --exclude='.env' \
            ./ /home/digimone/app.digimone.com/

      # 3. Build Node.js Frontend Assets (Vite/Tailwind/Mix)
      - name: Build Frontend Assets
        run: |
          cd /home/digimone/app.digimone.com/
          npm install --legacy-peer-deps
          npm run build

      # 4. Jalankan Optimasi & Migrasi Laravel
      - name: Optimize Laravel
        run: |
          cd /home/digimone/app.digimone.com/

          # Hapus file config/scribe.php lama dari server agar tidak memicu error class not found
          rm -f config/scribe.php

          # Install / update dependency Composer tanpa dev packages
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

          #Otomatis publish ulang config Scribe v5 (meng-overwrite config/scribe.php bermasalah)
          php artisan vendor:publish --tag=scribe-config --force || true

          #regenerate autoload files
          composer dump-autoload -o --no-scripts

          # Buat file .env jika belum ada
          if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate
          fi

          # Buat symlink storage jika belum terhubung
          php artisan storage:link || true

          # Jalankan migrasi database
          php artisan migrate --force

          # Bersihkan cache lama lalu buat cache baru
          php artisan optimize:clear
          php artisan optimize
          php artisan view:cache
          php artisan event:cache

      # 5. Perbaiki Hak Akses / Permission File CWP 7
      - name: Fix Directory Permissions
        run: |
          cd /home/digimone/app.digimone.com/
          # Setel hak akses folder storage & bootstrap/cache agar tidak Error 500
          chmod -R 775 storage bootstrap/cache 2>/dev/null || true