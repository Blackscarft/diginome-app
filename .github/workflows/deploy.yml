name: Deploy Laravel to CWP 7

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted  # Menggunakan Self-Hosted Runner di server CWP 7 Anda

    steps:
      # 1. Checkout Kode Terbaru dari Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sinkronkan File Proyek ke Folder Web CWP 7
      - name: Sync Files to Web Directory
        run: |
          rsync -rlptdz --delete \
            --no-g --no-o --no-p --omit-dir-times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/*.key' \
            --exclude='storage/app/public/*' \
            --exclude='public/storage' \
            --exclude='.env' \
            ./ /home/digimone/app.digimone.com/

      # 3. Build Node.js Frontend Assets (Vite/Tailwind/Mix)
      - name: Build Frontend Assets
        run: |
          cd /home/digimone/app.digimone.com/
          npm install --legacy-peer-deps
          npm run build

      # 4. Jalankan Optimasi, Migrasi, Shield, Scribe, & Queue
      - name: Optimize Laravel & Generate Packages
        run: |
          cd /home/digimone/app.digimone.com/

          # Install dependency terlebih dahulu
          composer install --optimize-autoloader --no-interaction --prefer-dist

          # Buat file .env jika belum ada
          if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate
          fi

          # Clear cache terlebih dahulu agar perintah artisan berjalan bersih
          php artisan optimize:clear

          # Regenerate autoload files
          composer dump-autoload -o --no-scripts

          # Buat symlink storage jika belum terhubung
          php artisan storage:link || true

          # Jalankan migrasi database & seeding
          php artisan migrate --force
          php artisan db:seed --force

          # ----------------------------------------------------
          # 🛡️ Filament Shield: Setup & Regenerate Permissions
          # ----------------------------------------------------
          php artisan shield:setup --no-interaction || true
          php artisan shield:generate --all --panel=admin --no-interaction || true

          # ----------------------------------------------------
          # 📚 Scribe: Generate API Documentation (Aman Mode Prod)
          # ----------------------------------------------------
          php artisan vendor:publish --tag=scribe-config --force || true
          php artisan scribe:generate --no-interaction

          # Buat cache baru untuk environment produksi
          php artisan optimize
          php artisan view:cache
          php artisan event:cache

          # ----------------------------------------------------
          # 🔄 Signal & Restart Queue Worker via Supervisor
          # ----------------------------------------------------
          php artisan queue:restart
          sudo /usr/bin/supervisorctl restart digimone-worker:* || true

      # 5. Perbaiki Hak Akses / Permission File CWP 7 (Aturan Ketat suPHP / CWP)
      - name: Fix Directory Permissions for CWP 7
        run: |
          cd /home/digimone/app.digimone.com/
          
          # Reset folder ke 755 & file ke 644
          find . -type d -exec chmod 755 {} \; 2>/dev/null || true
          find . -type f -exec chmod 644 {} \; 2>/dev/null || true
          
          # Kembalikan permission execute untuk artisan
          chmod +x artisan || true
          
          # Set permission storage & cache
          chmod -R 755 storage bootstrap/cache || true