name: Deploy Laravel to CWP 7

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted  # Menggunakan Self-Hosted Runner di server CWP 7 Anda

    steps:
      # 1. Checkout Kode Terbaru dari Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sinkronkan File Proyek ke Folder Web CWP 7
      - name: Sync Files to Web Directory
        run: |
          rsync -rlptdz --delete \
            --no-g --no-o --no-p --omit-dir-times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/*.key' \
            --exclude='storage/app/public/*' \
            --exclude='public/storage' \
            --exclude='.env' \
            ./ /home/digimone/app.digimone.com/

      # 3. Build Node.js Frontend Assets (Vite/Tailwind/Mix)
      - name: Build Frontend Assets
        run: |
          cd /home/digimone/app.digimone.com/
          npm install --legacy-peer-deps
          npm run build

      # 4. Jalankan Optimasi, Migrasi, Shield, Scribe, & Queue
      - name: Optimize Laravel & Generate Packages
        run: |
          cd /home/digimone/app.digimone.com/

          # Hapus file config/scribe.php lama dari server agar tidak memicu error class not found
          rm -f config/scribe.php

          # Install / update dependency Composer tanpa dev packages
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

          # Otomatis publish ulang config Scribe v5
          php artisan vendor:publish --tag=scribe-config --force || true

          # Regenerate autoload files
          composer dump-autoload -o --no-scripts

          # Buat file .env jika belum ada
          if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate
          fi

          # Buat symlink storage jika belum terhubung
          php artisan storage:link || true

          # Jalankan migrasi database & seeding
          php artisan migrate --force
          php artisan db:seed --force

          # ----------------------------------------------------
          # 🛡️ Filament Shield: Setup & Regenerate Permissions
          # ----------------------------------------------------
          php artisan shield:setup --no-interaction || true
          php artisan shield:generate --all --panel=admin --no-interaction || true

          # ----------------------------------------------------
          # 📚 Scribe: Generate API Documentation
          # ----------------------------------------------------
          php artisan scribe:generate --no-interaction

          # Bersihkan cache lama lalu buat cache baru
          php artisan optimize:clear
          php artisan optimize
          php artisan view:cache
          php artisan event:cache

          # ----------------------------------------------------
          # 🔄 Signal & Restart Queue Worker via Supervisor
          # ----------------------------------------------------
          php artisan queue:restart
          sudo /usr/bin/supervisorctl restart digimone-worker:*

      # 5. Perbaiki Hak Akses / Permission File CWP 7 (suPHP)
      - name: Fix Directory Permissions
        run: |
          cd /home/digimone/app.digimone.com/
          
          # Set ownership ke user digimone
          chown -R digimone:digimone .
          
          # Reset folder 755 & file 644 (termasuk public/docs hasil Scribe)
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          
          # Set izin khusus penulisan hanya untuk storage & cache
          chmod -R 775 storage bootstrap/cache